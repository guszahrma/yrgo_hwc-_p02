name: CI

# Push only: a pull request comes from a pushed branch, which CI has already tested
# (see AGENTS.md: When CI runs).
on:
  push:

jobs:
  format-check:
    name: Check code formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install clang-format
        run: tools/clang-format/run.sh --version
      - name: Check code formatting
        run: tools/clang-format/check.sh

  windows-format-check:
    name: Check code formatting on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install clang-format
        shell: pwsh
        run: tools/clang-format/run.ps1 --version
      - name: Check code formatting
        shell: pwsh
        run: tools/clang-format/check.ps1

  esp-idf-build-nano:
    name: Build ESP32-S3 firmware on Ubuntu
    runs-on: ubuntu-latest
    container: espressif/idf:release-v6.0
#    needs: format-check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build firmware
        shell: bash
        run: |
          source /opt/esp/idf/export.sh
          cp main/include/communication/wifi/esp32s3_local_config_template.h main/include/communication/wifi/esp32s3_local_config.h
          idf.py set-target esp32s3
          idf.py build
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware-esp-idf-nano
          # bootloader, partition table and flash_args too, so the hardware test can flash a whole
          # image (the Nano may have Zephyr or the Arduino bootloader on it)
          path: |
            build/*.bin
            build/*.elf
            build/*.map
            build/flash_args
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
          if-no-files-found: error
          retention-days: 3

  esp-idf-build-nano-windows:
    name: Build ESP32-S3 firmware on Windows
    runs-on: windows-latest
#    needs: format-check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install ESP-IDF 6.0 for ESP32-S3
        shell: pwsh
        run: |
          $idfPath = Join-Path $env:RUNNER_TEMP 'esp-idf'
          git clone --recursive --branch v6.0 https://github.com/espressif/esp-idf.git $idfPath
          & (Join-Path $idfPath 'install.bat') esp32s3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          . (Join-Path $idfPath 'export.ps1')
          Copy-Item main/include/communication/wifi/esp32s3_local_config_template.h main/include/communication/wifi/esp32s3_local_config.h
          idf.py set-target esp32s3
          idf.py build
      - name: Upload Windows firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware-esp-idf-nano-windows
          path: |
            build/*.bin
            build/*.elf
            build/*.map
          if-no-files-found: error
          retention-days: 3

  zephyr-build-nano:
    name: Build Zephyr apps for the Arduino Nano ESP32
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build gperf device-tree-compiler
      - name: Set up the Zephyr workspace (Zephyr version from west.yml)
        run: tools/zephyr_setup.sh
      # P02 with MCUboot (zephyr/app/sysbuild.conf). BOARD_ROOT is needed on the command line: sysbuild
      # looks up the board before the app's CMakeLists.txt runs.
      - name: Build the P02 app with MCUboot
        run: |
          source tools/zephyr_env.sh
          west build -p always --sysbuild -d build-zephyr/app -b arduino_nano_esp32/esp32s3/procpu zephyr/app -- -DBOARD_ROOT=$P02_ROOT/zephyr
      - name: Build blinky
        run: |
          source tools/zephyr_env.sh
          west build -p always -d build-zephyr/blinky -b arduino_nano_esp32/esp32s3/procpu zephyr/samples/blinky
      - name: Upload Zephyr firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware-zephyr-nano
          path: |
            build-zephyr/app/mcuboot/zephyr/zephyr.bin
            build-zephyr/app/app/zephyr/zephyr.signed.bin
            build-zephyr/app/app/zephyr/zephyr.elf
            build-zephyr/blinky/zephyr/zephyr.bin
          if-no-files-found: error
          retention-days: 3

  zephyr-build-daisy:
    name: Build Zephyr apps for the Daisy Seed
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build gperf device-tree-compiler
      - name: Set up the Zephyr workspace (Zephyr version from west.yml)
        run: tools/zephyr_setup.sh
      - name: Build Zephyr's blinky
        run: |
          source tools/zephyr_env.sh
          west build -p always -d build-zephyr/daisy-blinky -b daisy_seed $ZEPHYR_BASE/samples/basic/blinky -- -DBOARD_ROOT=$P02_ROOT/zephyr
      # P02 with MCUboot. BOARD_ROOT is needed here too: sysbuild looks up the board before the app's
      # CMakeLists.txt runs.
      - name: Build the P02 app with MCUboot
        run: |
          source tools/zephyr_env.sh
          west build -p always --sysbuild -d build-zephyr/daisy-app -b daisy_seed/stm32h750xx/ram_load zephyr/app -- -DBOARD_ROOT=$P02_ROOT/zephyr
      - name: Upload Zephyr firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware-zephyr-daisy
          path: |
            build-zephyr/daisy-blinky/zephyr/zephyr.bin
            build-zephyr/daisy-app/mcuboot/zephyr/zephyr.bin
            build-zephyr/daisy-app/app/zephyr/zephyr.signed.bin
            build-zephyr/daisy-app/app/zephyr/zephyr.elf
          if-no-files-found: error
          retention-days: 3

  zephyr-build-nucleo:
    name: Build Zephyr apps for the Nucleo-G0B1RE
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build gperf device-tree-compiler
      - name: Set up the Zephyr workspace (Zephyr version from west.yml)
        run: tools/zephyr_setup.sh
      # The board is in Zephyr, so no BOARD_ROOT.
      - name: Build Zephyr's blinky
        run: |
          source tools/zephyr_env.sh
          west build -p always -d build-zephyr/nucleo-blinky -b nucleo_g0b1re $ZEPHYR_BASE/samples/basic/blinky
      - name: Build the P02 app with MCUboot
        run: |
          source tools/zephyr_env.sh
          west build -p always --sysbuild -d build-zephyr/nucleo-app -b nucleo_g0b1re zephyr/app
      # The .hex files for hardware-test-nucleo (OpenOCD writes each at the addresses it contains)
      - name: Upload Zephyr firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware-zephyr-nucleo
          path: |
            build-zephyr/nucleo-blinky/zephyr/zephyr.bin
            build-zephyr/nucleo-app/mcuboot/zephyr/zephyr.bin
            build-zephyr/nucleo-app/mcuboot/zephyr/zephyr.hex
            build-zephyr/nucleo-app/app/zephyr/zephyr.signed.bin
            build-zephyr/nucleo-app/app/zephyr/zephyr.signed.hex
            build-zephyr/nucleo-app/app/zephyr/zephyr.elf
          if-no-files-found: error
          retention-days: 3

  # The Ztest apps in zephyr/tests on native_sim: Zephyr's drivers with simulated hardware, no board.
  zephyr-tests:
    name: Run Zephyr tests on native_sim
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build gperf device-tree-compiler
      - name: Set up the Zephyr workspace (Zephyr version from west.yml)
        run: tools/zephyr_setup.sh
      - name: Build and run the tests with Twister
        run: |
          source tools/zephyr_env.sh
          west twister -T zephyr/tests -p native_sim/native/64 --outdir build-zephyr/twister --inline-logs
      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zephyr-tests-report
          path: build-zephyr/twister/twister.xml
          retention-days: 3

  unit-tests:
    name: Run unit tests on the host
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build and run the tests
        run: |
          cmake -S tests -B tests/build
          cmake --build tests/build

  # Flashes the ESP-IDF firmware from esp-idf-build-nano on a Nano ESP32 and tests P02 over USB serial.
  # Runs on a self-hosted runner with the label arduino_nano_esp32 (the board attached through usbipd, port
  # /dev/tty_arduino_nano_esp32, ESP-IDF 6.0 in ~/esp/esp-idf). If the runner is offline, the job waits.
  # The board's one runner runs one job at a time, so this job and hardware-test-nano-zephyr take
  # turns. Each has its own concurrency group: a group keeps only one waiting job and cancels the other.
  hardware-test-nano:
    name: Flash and test ESP-IDF on the Nano ESP32
    runs-on: [self-hosted, arduino_nano_esp32]
    # A hung flash or test would otherwise hold the board's runner for GitHub's 6 hours
    timeout-minutes: 10
    needs: esp-idf-build-nano
    # A newer push replaces this job's waiting run
    concurrency:
      group: hardware-test-nano
      cancel-in-progress: false
    env:
      PORT: /dev/tty_arduino_nano_esp32
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Download firmware
        uses: actions/download-artifact@v7
        with:
          name: firmware-esp-idf-nano
          path: firmware
      - name: Check that the board is attached
        run: |
          test -e "$PORT" || { echo "::error::$PORT not found: is the Nano attached (usbipd attach)?"; exit 1; }
          if fuser "$PORT" 2>/dev/null; then echo "::error::$PORT is in use (tio or a monitor open?)"; exit 1; fi
      # The nvs partition (0x9000, 0x6000) first: Zephyr's MCUboot (~37 KB from 0x0) is written over its start
      - name: Flash
        working-directory: firmware
        run: |
          . ~/esp/esp-idf/export.sh > /dev/null
          python -m esptool --chip esp32s3 -p "$PORT" -b 460800 --before default-reset --after no-reset erase-region 0x9000 0x6000
          python -m esptool --chip esp32s3 -p "$PORT" -b 460800 --before default-reset --after hard-reset write-flash @flash_args
      - name: Test P02 over serial
        run: |
          . ~/esp/esp-idf/export.sh > /dev/null
          python tools/hil/p02_test.py --port "$PORT"

  # Flashes P02 from zephyr-build-nano on the same Nano ESP32 and tests it, as hardware-test-nano does
  # for ESP-IDF (esptool from ESP-IDF on the runner).
  hardware-test-nano-zephyr:
    name: Flash and test Zephyr on the Nano ESP32
    runs-on: [self-hosted, arduino_nano_esp32]
    # A hung flash or test would otherwise hold the board's runner for GitHub's 6 hours
    timeout-minutes: 10
    needs: zephyr-build-nano
    concurrency:
      group: hardware-test-nano-zephyr
      cancel-in-progress: false
    env:
      PORT: /dev/tty_arduino_nano_esp32
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Download firmware
        uses: actions/download-artifact@v7
        with:
          name: firmware-zephyr-nano
          path: firmware
      - name: Check that the board is attached
        run: |
          test -e "$PORT" || { echo "::error::$PORT not found: is the Nano attached (usbipd attach)?"; exit 1; }
          if fuser "$PORT" 2>/dev/null; then echo "::error::$PORT is in use (tio or a monitor open?)"; exit 1; fi
      # MCUboot at 0x0 (boot_partition), P02 at 0x20000 (slot0_partition)
      - name: Flash
        working-directory: firmware/app
        run: |
          . ~/esp/esp-idf/export.sh > /dev/null
          python -m esptool --chip esp32s3 -p "$PORT" -b 460800 --before default-reset --after hard-reset write-flash 0x0 mcuboot/zephyr/zephyr.bin 0x20000 app/zephyr/zephyr.signed.bin
      - name: Test P02 over serial
        run: |
          . ~/esp/esp-idf/export.sh > /dev/null
          python tools/hil/p02_test.py --port "$PORT" --platform Zephyr

  # Flashes P02 from zephyr-build-nucleo on a Nucleo-G0B1RE and tests it over the ST-Link's serial port.
  # Runs on a self-hosted runner with the label nucleo_g0b1re (the board attached through usbipd, port
  # /dev/tty_nucleo_g0b1re, the apt packages openocd and python3-serial).
  hardware-test-nucleo:
    name: Flash and test on the Nucleo-G0B1RE
    runs-on: [self-hosted, nucleo_g0b1re]
    # A hung flash or test would otherwise hold the board's runner for GitHub's 6 hours
    timeout-minutes: 10
    needs: zephyr-build-nucleo
    concurrency:
      group: hardware-test-nucleo
      cancel-in-progress: false
    env:
      PORT: /dev/tty_nucleo_g0b1re
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Download firmware
        uses: actions/download-artifact@v7
        with:
          name: firmware-zephyr-nucleo
          path: firmware
      - name: Check that the board is attached
        run: |
          test -e "$PORT" || { echo "::error::$PORT not found: is the Nucleo attached (usbipd attach)?"; exit 1; }
          if fuser "$PORT" 2>/dev/null; then echo "::error::$PORT is in use (tio or a monitor open?)"; exit 1; fi
      # MCUboot and P02, each at the addresses in its .hex file. Zephyr's board uses the same OpenOCD
      # board file (boards/st/nucleo_g0b1re/support/openocd.cfg)
      - name: Flash
        working-directory: firmware/nucleo-app
        run: >-
          openocd -f board/st_nucleo_g0.cfg
          -c "program mcuboot/zephyr/zephyr.hex verify"
          -c "program app/zephyr/zephyr.signed.hex verify reset exit"
      - name: Test P02 over serial
        run: python3 tools/hil/p02_test.py --port "$PORT" --board nucleo_g0b1re --platform Zephyr
