name: CI

on:
  push:
  pull_request:

jobs:
  format-check:
    name: Check code formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install clang-format
        run: tools/clang-format/run.sh --version
      - name: Check code formatting
        run: tools/clang-format/check.sh

  windows-format-check:
    name: Check code formatting on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install clang-format
        shell: pwsh
        run: tools/clang-format/run.ps1 --version
      - name: Check code formatting
        shell: pwsh
        run: tools/clang-format/check.ps1

  firmware-build:
    name: Build ESP32-S3 firmware on Ubuntu
    runs-on: ubuntu-latest
    container: espressif/idf:release-v6.0
#    needs: format-check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build firmware
        shell: bash
        run: |
          source /opt/esp/idf/export.sh
          cp main/include/communication/wifi/esp32s3_local_config_template.h main/include/communication/wifi/esp32s3_local_config.h
          idf.py set-target esp32s3
          idf.py build
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: |
            build/*.bin
            build/*.elf
            build/*.map
          if-no-files-found: error
          retention-days: 3

  windows-build:
    name: Build ESP32-S3 firmware on Windows
    runs-on: windows-latest
#    needs: format-check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install ESP-IDF 6.0 for ESP32-S3
        shell: pwsh
        run: |
          $idfPath = Join-Path $env:RUNNER_TEMP 'esp-idf'
          git clone --recursive --branch v6.0 https://github.com/espressif/esp-idf.git $idfPath
          & (Join-Path $idfPath 'install.bat') esp32s3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          . (Join-Path $idfPath 'export.ps1')
          Copy-Item main/include/communication/wifi/esp32s3_local_config_template.h main/include/communication/wifi/esp32s3_local_config.h
          idf.py set-target esp32s3
          idf.py build
      - name: Upload Windows firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware-windows
          path: |
            build/*.bin
            build/*.elf
            build/*.map
          if-no-files-found: error
          retention-days: 3

  zephyr-build:
    name: Build Zephyr apps for the Arduino Nano ESP32
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build gperf device-tree-compiler
      - name: Set up the Zephyr workspace (Zephyr version from west.yml)
        run: tools/zephyr_setup.sh
      # P02 with MCUboot (zephyr/app/sysbuild.conf). BOARD_ROOT is needed on the command line: sysbuild
      # looks up the board before the app's CMakeLists.txt runs.
      - name: Build the P02 app with MCUboot
        run: |
          source tools/zephyr_env.sh
          west build -p always --sysbuild -d build-zephyr/app -b arduino_nano_esp32/esp32s3/procpu zephyr/app -- -DBOARD_ROOT=$P02_ROOT/zephyr
      - name: Build blinky
        run: |
          source tools/zephyr_env.sh
          west build -p always -d build-zephyr/blinky -b arduino_nano_esp32/esp32s3/procpu zephyr/samples/blinky
      - name: Upload Zephyr firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware-zephyr
          path: |
            build-zephyr/app/mcuboot/zephyr/zephyr.bin
            build-zephyr/app/app/zephyr/zephyr.signed.bin
            build-zephyr/app/app/zephyr/zephyr.elf
            build-zephyr/blinky/zephyr/zephyr.bin
          if-no-files-found: error
          retention-days: 3

  zephyr-build-daisy:
    name: Build Zephyr apps for the Daisy Seed
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build gperf device-tree-compiler
      - name: Set up the Zephyr workspace (Zephyr version from west.yml)
        run: tools/zephyr_setup.sh
      - name: Build Zephyr's blinky
        run: |
          source tools/zephyr_env.sh
          west build -p always -d build-zephyr/daisy-blinky -b daisy_seed $ZEPHYR_BASE/samples/basic/blinky -- -DBOARD_ROOT=$P02_ROOT/zephyr
      # P02 with MCUboot. BOARD_ROOT is needed here too: sysbuild looks up the board before the app's
      # CMakeLists.txt runs.
      - name: Build the P02 app with MCUboot
        run: |
          source tools/zephyr_env.sh
          west build -p always --sysbuild -d build-zephyr/daisy-app -b daisy_seed/stm32h750xx/ram_load zephyr/app -- -DBOARD_ROOT=$P02_ROOT/zephyr
      - name: Upload Zephyr firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware-zephyr-daisy
          path: |
            build-zephyr/daisy-blinky/zephyr/zephyr.bin
            build-zephyr/daisy-app/mcuboot/zephyr/zephyr.bin
            build-zephyr/daisy-app/app/zephyr/zephyr.signed.bin
            build-zephyr/daisy-app/app/zephyr/zephyr.elf
          if-no-files-found: error
          retention-days: 3

  zephyr-build-nucleo:
    name: Build Zephyr apps for the Nucleo-G0B1RE
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build gperf device-tree-compiler
      - name: Set up the Zephyr workspace (Zephyr version from west.yml)
        run: tools/zephyr_setup.sh
      # The board is in Zephyr, so no BOARD_ROOT.
      - name: Build Zephyr's blinky
        run: |
          source tools/zephyr_env.sh
          west build -p always -d build-zephyr/nucleo-blinky -b nucleo_g0b1re $ZEPHYR_BASE/samples/basic/blinky
      - name: Build the P02 app with MCUboot
        run: |
          source tools/zephyr_env.sh
          west build -p always --sysbuild -d build-zephyr/nucleo-app -b nucleo_g0b1re zephyr/app
      - name: Upload Zephyr firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware-zephyr-nucleo
          path: |
            build-zephyr/nucleo-blinky/zephyr/zephyr.bin
            build-zephyr/nucleo-app/mcuboot/zephyr/zephyr.bin
            build-zephyr/nucleo-app/app/zephyr/zephyr.signed.bin
            build-zephyr/nucleo-app/app/zephyr/zephyr.elf
          if-no-files-found: error
          retention-days: 3

  unit-tests:
    name: Run unit tests on the host
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build and run the tests
        run: |
          cmake -S tests -B tests/build
          cmake --build tests/build