# C++17 with the full standard library
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y

# Wait 1 s before booting, so the monitor can open the USB console (re-attached by usbipd after the
# reset) before the boot output is printed.
CONFIG_BOOT_DELAY=1000

# std::cout in libstdc++ needs POSIX I/O functions (open, read, write, close, ...).
CONFIG_POSIX_API=y

CONFIG_ADC=y

# nvs::Zephyr: the Settings subsystem stores its keys in storage_partition with the NVS backend.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y

# Watchdog (driver::watchdog::Zephyr) and the reset cause (hwinfo) for causedLastReset().
CONFIG_WATCHDOG=y
CONFIG_HWINFO=y