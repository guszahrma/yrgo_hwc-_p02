# C++17 with the full standard library
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y

# Wait 1 s before booting, so the monitor can open the USB console (re-attached by usbipd after the
# reset) before the boot output is printed.
CONFIG_BOOT_DELAY=1000

# std::this_thread::sleep_for in Logic::step() needs POSIX functions from libstdc++ (usleep, sleep,
# gettimeofday); without this the link fails.
CONFIG_POSIX_API=y

# Logic runs in the main thread, including `store` (Settings -> NVS -> flash driver). Zephyr's default
# of 1 KB is too small for that (see AGENTS.md: Main stack).
CONFIG_MAIN_STACK_SIZE=4096

CONFIG_ADC=y

# serial::Zephyr reads DTR to see when a monitor opens the port, and then drops the input received
# before (on a USB serial port, CDC ACM; other UARTs report "not supported" and nothing changes).
CONFIG_UART_LINE_CTRL=y

# serial::Zephyr receives by interrupt into a ring buffer, so bytes arriving between two readLine()
# calls are kept.
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

# nvs::Zephyr: the Settings subsystem stores its keys in storage_partition with the NVS backend.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y

# Watchdog (driver::watchdog::Zephyr) and the reset cause (hwinfo) for causedLastReset().
CONFIG_WATCHDOG=y
CONFIG_HWINFO=y