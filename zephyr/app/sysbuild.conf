# P02 on Zephyr boots through MCUboot on every board (build with --sysbuild).
# No signature yet, only a hash check; this also overrides the Daisy board's own default.
# The MCUboot mode is left to each board: setting it here would override the Daisy's RAM load
# (see AGENTS.md: Bootloader).
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_NONE=y
