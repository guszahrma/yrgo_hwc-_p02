# P02 on Zephyr boots through MCUboot on every board (build with --sysbuild).
# No signature yet, only a hash check: signing comes with the update demo (Fas 1, PR 3).
# The MCUboot mode is each board's default (Nucleo: swap using offset, Nano: overwrite only,
# Daisy: RAM load); setting it here would override the Daisy's RAM load.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_NONE=y
