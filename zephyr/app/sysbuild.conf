# P02 on Zephyr boots through MCUboot on every board (build with --sysbuild).
# No signature yet, only a hash check: signing comes later in Fas 1.
# The MCUboot mode is set per board in Kconfig.sysbuild (swap using move on the Nucleo and the Nano);
# the Daisy keeps its board's RAM load.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_NONE=y
