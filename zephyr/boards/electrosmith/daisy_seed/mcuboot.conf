# MCUboot on the Daisy Seed (used by sysbuild.cmake).

# Serial recovery (mcumgr) over the USB serial port, on Zephyr's new USB stack. A RESET press enters
# it (mcuboot_hooks.c tells RESET from power-on and software resets by the reset flags); every other
# reset boots the app at once. Not CONFIG_BOOT_SERIAL_PIN_RESET: the STM32H7 sets the pin-reset flag
# on every reset, so MCUboot never booted the app.
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_UART=y
CONFIG_BOOT_GO_HOOKS=y
# Recovery when there is no valid app in QSPI flash (first boot, a broken upload), and the path the
# hook uses for a RESET press.
CONFIG_BOOT_SERIAL_NO_APPLICATION=y
# No button MCUboot can read (BOOT is the ROM bootloader's).
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=n
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
# The USB serial port is mcumgr's, not a console.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# RAM load: the app is copied into AXI SRAM (MCUboot itself uses DTCM, see mcuboot.overlay).
CONFIG_BOOT_IMAGE_EXECUTABLE_RAM_START=0x24000000
CONFIG_BOOT_IMAGE_EXECUTABLE_RAM_SIZE=524288
