# MCUboot on the Daisy Seed (used by sysbuild.cmake).

# Serial recovery (mcumgr) over the USB serial port, on Zephyr's new USB stack. MCUboot waits for an
# mcumgr command after every reset, then boots the app. Long, because usbipd needs 5-15 s to re-attach
# the board to WSL. Not BOOT_SERIAL_PIN_RESET: the STM32H7 sets the pin-reset flag on every reset
# (power-on and software reset too), so MCUboot never booted the app.
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_UART=y
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU=y
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU_TIMEOUT=15000
# Also when there is no valid app in QSPI flash (first boot, or a broken upload).
CONFIG_BOOT_SERIAL_NO_APPLICATION=y
# No button MCUboot can read (BOOT is the ROM bootloader's).
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=n
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
# The USB serial port is mcumgr's, not a console.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# RAM load: the app is copied into AXI SRAM (MCUboot itself uses DTCM, see mcuboot.overlay).
CONFIG_BOOT_IMAGE_EXECUTABLE_RAM_START=0x24000000
CONFIG_BOOT_IMAGE_EXECUTABLE_RAM_SIZE=524288
