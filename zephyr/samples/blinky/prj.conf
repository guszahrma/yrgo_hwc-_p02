# GPIO driver support (gpio_pin_configure_dt, gpio_pin_set_dt, ...).
CONFIG_GPIO=y

# Wait 10 s before booting. The console runs over the ESP32-S3's built-in USB, which disconnects on
# every reset; usbipd needs ~8 s to re-attach it to WSL. Without the delay, boot output is lost.
CONFIG_BOOT_DELAY=10000
