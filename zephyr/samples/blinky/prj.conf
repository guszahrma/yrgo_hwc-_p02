# GPIO driver support (gpio_pin_configure_dt, gpio_pin_set_dt, ...).
CONFIG_GPIO=y

# Wait 1 s before booting. The console runs over the ESP32-S3's built-in USB, which disconnects on
# every reset and has to be re-attached to WSL by usbipd. Without the delay, boot output is lost.
CONFIG_BOOT_DELAY=1000
